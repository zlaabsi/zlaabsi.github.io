<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{{ARTICLE_TITLE}}}</title>
<style>
@media (prefers-color-scheme: dark) {
  .tc-bg { background: #141413 !important; }
  .tc-head { color: #faf9f5 !important; }
  .tc-text { color: #dcdcdc !important; }
  .tc-muted { color: #a1a1a1 !important; }
  .tc-rule { border-top-color: #303030 !important; }
  .tc-btn { background: #faf9f5 !important; }
  .tc-btn a { color: #141413 !important; }
}
</style>
</head>
<body class="tc-bg" style="margin:0;padding:0;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#333333;-webkit-font-smoothing:antialiased;">
<span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;font-size:1px;line-height:1px;mso-hide:all;">{{{ARTICLE_SUMMARY}}}</span>
<table role="presentation" class="tc-bg" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#ffffff;">
  <tr>
    <td align="center" style="padding:36px 24px 40px 24px;">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width:600px;width:100%;">
        <tr>
          <td style="padding:0 0 36px 0;">
            <a class="tc-head" href="{{{SITE_URL}}}" style="font-size:16px;font-weight:700;color:#000000;text-decoration:none;">Zakaria Laabsi</a>
          </td>
        </tr>
        <tr>
          <td>
            <p class="tc-muted" style="margin:0;font-size:13px;line-height:1.4;color:#666666;">New essay · {{{ARTICLE_PUBLISHED_AT}}} · {{{ARTICLE_READ_TIME}}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 0 0 0;">
            <h1 class="tc-head" style="margin:0;font-size:32px;line-height:1.14;font-weight:700;letter-spacing:-0.01em;color:#000000;">{{{ARTICLE_TITLE}}}</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 0 0 0;">
            <a href="{{{ARTICLE_URL}}}" style="display:block;text-decoration:none;"><img src="{{{ARTICLE_URL}}}email.png" width="600" alt="Illustration from the essay" style="display:block;width:100%;max-width:600px;height:auto;border:1px solid #e6e6e6;border-radius:4px;"></a>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 0 0 0;">
            <p class="tc-text" style="margin:0;font-size:17px;line-height:1.7;color:#333333;">{{{ARTICLE_SUMMARY}}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 0 0 0;" align="left">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td class="tc-btn" style="background:#141413;border-radius:4px;">
                  <a href="{{{ARTICLE_URL}}}" style="display:inline-block;padding:12px 20px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Read the essay →</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 0 0 0;">
            <p class="tc-muted" style="margin:0;font-size:13px;line-height:1.6;color:#666666;">Or open in a browser: <a class="tc-muted" href="{{{ARTICLE_URL}}}" style="color:#666666;text-decoration:underline;word-break:break-all;">{{{ARTICLE_URL}}}</a></p>
          </td>
        </tr>
        <tr>
          <td style="padding:40px 0 0 0;">
            <hr class="tc-rule" style="border:0;border-top:1px solid #e6e6e6;margin:0 0 18px 0;">
            <p class="tc-muted" style="margin:0;font-size:13px;line-height:1.6;color:#666666;">You subscribed at <a class="tc-muted" href="{{{SITE_URL}}}" style="color:#666666;text-decoration:underline;">{{{SITE_URL}}}</a>. <a class="tc-muted" href="{{{UNSUBSCRIBE_URL}}}" style="color:#666666;text-decoration:underline;">Unsubscribe</a> · <a class="tc-muted" href="{{{RSS_URL}}}" style="color:#666666;text-decoration:underline;">Switch to RSS</a></p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
